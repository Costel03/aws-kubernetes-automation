apiVersion: batch/v1
kind: CronJob
metadata:
  name: cron-test
spec:
  schedule: "*/1 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cron-test
            image: python:3.12-slim
            args:
            - /bin/sh
            - -c
            - python3 /configmap/hello.py
            volumeMounts:
            - name: scripts-cm
              mountPath: /configmap
          restartPolicy: OnFailure
          volumes:
          - name: scripts-cm
            configMap:
              name: scripts-cm